# Index lokal (fallback) — dipakai saat kuota Gemini tidak tersedia.
#
# Model berbeda dari index Gemini, jadi index_version dan cache-nya terpisah;
# keduanya tidak bisa tertukar. bge-small butuh instruksi khusus untuk query.

snapshot: pokerag-corpus-v1
strategy: heading
artifacts_root: artifacts

embedder:
  provider: local
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 32
  items_per_minute: 0
  max_retries: 1
  timeout_seconds: 120

qdrant:
  mode: local
  distance: cosine
  on_disk: true

bm25:
  k1: 1.2
  b: 0.75
