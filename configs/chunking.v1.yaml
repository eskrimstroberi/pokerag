# Chunking v1 — three strategies for ablation A1 and the B2 baseline.
#
# `fixed` is the mandated B2 baseline (512 token ~= 2048 chars, 12.5% overlap).
# `heading` is the candidate: heading boundaries, recursive split of long
# sections, 10% overlap, and padding of short sections inside the same h2 block.
# `hierarchical` adds parents for context expansion (A7).

snapshot: pokerag-corpus-v1
artifacts_root: artifacts
tokenizer: estimate      # ganti ke "hf:BAAI/bge-m3" saat index dibangun
budget_tokens: 2048

fixed:
  window_chars: 2048
  overlap_chars: 256

heading:
  max_chars: 1200
  overlap_chars: 120
  min_chars: 240

hierarchical:
  parent_chars: 1500
  parent_overlap_chars: 0
  child_chars: 1000
  child_overlap_chars: 100
  min_chars: 200
